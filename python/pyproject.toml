[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawdiver"
version = "1.0.0"
description = "Python client examples for the LawDiver caselaw API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://lawdiver.com"
Documentation = "https://lawdiver.com/docs/api"
Repository = "https://github.com/dumpsticks/LawDiver_api"

[tool.setuptools.packages.find]
include = ["lawdiver*"]
